<section class="flex flex-col gap-6">
  <!-- Cabecera -->
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="text-sm text-base-content/60">
        {{ todayDate | date: "EEEE, d 'de' MMMM 'de' y" }}
      </p>
      <h1 class="text-4xl font-bold mt-1">Hoy</h1>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-sm text-base-content/60">Programa activo</span>
      <span
        class="badge badge-success badge-soft badge-lg rounded-full font-semibold"
      >
        {{ programName() }}
      </span>
    </div>
  </div>

  <!-- Semana -->
  <div class="grid grid-cols-7 gap-2 sm:gap-3">
    @for (day of weekDays(); track day.date.getTime()) {
      <!-- Seleccionado: relleno primario · Hoy (sin seleccionar): solo borde primario -->
      <button
        type="button"
        class="rounded-xl border py-4 px-1 flex flex-col items-center gap-1 text-center cursor-pointer transition-colors"
        [class]="
          day.isSelected
            ? 'bg-primary text-primary-content border-primary'
            : day.isToday
              ? 'bg-base-200 border-primary border-2'
              : 'bg-base-200 border-base-300 hover:border-primary/50'
        "
        [attr.aria-pressed]="day.isSelected"
        (click)="onDaySelected(day)"
      >
        <span class="font-bold text-sm">{{ day.date | date: "EEE d" }}</span>
        <span
          class="text-xs truncate max-w-full"
          [class]="
            day.isSelected ? 'text-primary-content/80' : 'text-base-content/60'
          "
        >
          {{ day.routineName }}
        </span>
      </button>
    }
  </div>
</section>
