<section
  class="card h-full border border-base-300 bg-base-200"
  aria-labelledby="week-stats-title"
>
  <div class="card-body gap-4 p-5">
    <h2 id="week-stats-title" class="font-bold text-base-content/80">
      Esta semana
    </h2>

    <!-- tabular-nums: todas las cifras ocupan lo mismo y no "bailan" al cambiar -->
    <dl class="grid grid-cols-3 gap-3 tabular-nums">
      <div class="flex flex-col gap-1 rounded-xl bg-base-100 p-3">
        <dt class="text-xs text-base-content/60">Sesiones</dt>
        <dd class="text-2xl font-bold">
          {{ stats().sessionsDone }}
          <span class="text-sm font-semibold text-base-content/60">
            / {{ stats().sessionsPlanned }}
          </span>
        </dd>
      </div>
      <div class="flex flex-col gap-1 rounded-xl bg-base-100 p-3">
        <dt class="text-xs text-base-content/60">Series</dt>
        <dd class="text-2xl font-bold">{{ stats().totalSets }}</dd>
      </div>
      <div class="flex flex-col gap-1 rounded-xl bg-base-100 p-3">
        <dt class="text-xs text-base-content/60">Volumen</dt>
        <dd class="text-2xl font-bold whitespace-nowrap">
          {{ stats().totalVolumeKg | volume }}
        </dd>
      </div>
    </dl>

    @if (stats().sessionsDone === 0) {
      <!-- Estado vacío: semana sin sesiones todavía -->
      <p class="text-sm text-base-content/60">
        Aún no has registrado ninguna sesión esta semana.
      </p>
    }
  </div>
</section>
