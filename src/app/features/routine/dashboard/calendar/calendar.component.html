<section class="flex flex-col gap-6">
  <!-- Header -->
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="text-sm text-base-content/60">
        {{ todayDate | date: "EEEE, d 'de' MMMM 'de' y" }}
      </p>
      <h1 class="text-4xl font-bold mt-1">Hoy</h1>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-sm text-base-content/60">Programa activo</span>
      <span class="badge badge-success badge-soft badge-lg rounded-full font-semibold">
        {{ programName() }}
      </span>
    </div>
  </div>

  <!-- Week -->
  <div class="grid grid-cols-7 gap-2 sm:gap-3">
    @for (day of weekDays(); track day.date.getTime()) {
      <div
        class="rounded-xl border py-4 px-1 flex flex-col items-center gap-1 text-center"
        [class]="
          day.isToday
            ? 'bg-primary text-primary-content border-primary'
            : 'bg-base-200 border-base-300'
        "
      >
        <span class="font-bold text-sm">{{ day.date | date: "EEE d" }}</span>
        <span
          class="text-xs truncate max-w-full"
          [class]="day.isToday ? 'text-primary-content/80' : 'text-base-content/60'"
        >
          {{ day.routineName }}
        </span>
      </div>
    }
  </div>
</section>
