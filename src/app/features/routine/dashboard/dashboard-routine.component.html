<div class="min-h-screen bg-base-200 p-6">
  <div class="max-w-4xl mx-auto">

    <div class="text-center mb-12">
      <h1 class="text-4xl font-bold text-base-content">My Routines</h1>
      <p class="text-base-content/60 mt-2">Manage your workout routines and stay on track</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <div class="card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow duration-300">
        <div class="card-body items-center text-center">
          <div class="bg-primary/10 rounded-full p-4 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
          </div>
          <h2 class="card-title text-xl">View Routines</h2>
          <p class="text-base-content/60">Browse and manage all your saved workout routines</p>
          <div class="card-actions mt-4">
            <button routerLink="/routines" class="btn btn-primary btn-wide">View All</button>
          </div>
        </div>
      </div>

      <div class="card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow duration-300">
        <div class="card-body items-center text-center">
          <div class="bg-secondary/10 rounded-full p-4 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
          </div>
          <h2 class="card-title text-xl">New Routine</h2>
          <p class="text-base-content/60">Create a new custom workout routine from scratch</p>
          <div class="card-actions mt-4">
            <button routerLink="/create/step-1" class="btn btn-secondary btn-wide cursor-pointer">Create</button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
