<div class="flex justify-center px-4 py-8">
  <div class="card bg-base-200 shadow-xl w-full max-w-lg">
    <div class="card-body">
      <app-create-header
        [currentStep]="1"
        title="Create routine"
        subtitle="Set up the basic details for your new routine"
      />

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onNext()" class="flex flex-col gap-5 mt-2">

        <!-- Name -->
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Program name *</legend>
          <input
            type="text"
            formControlName="name"
            placeholder="e.g. Push Pull Legs, Full Body..."
            class="input input-bordered w-full"
            [class.input-error]="form.controls.name.touched && form.controls.name.invalid"
          />
          @if (form.controls.name.touched && form.controls.name.errors) {
            <p class="fieldset-label text-error">
              @if (form.controls.name.errors['required']) {
                Name is required
              } @else if (form.controls.name.errors['minlength']) {
                Minimum 3 characters
              }
            </p>
          }
        </fieldset>

        <!-- Description -->
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Description</legend>
          <textarea
            formControlName="description"
            placeholder="Briefly describe your routine..."
            class="textarea textarea-bordered w-full resize-none"
            rows="3"
          ></textarea>
          <span class="fieldset-label">Optional</span>
        </fieldset>

        <!-- Active checkbox -->
        <fieldset class="fieldset">
          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              formControlName="isActive"
              class="toggle toggle-primary"
            />
            <div>
              <span class="font-medium">Set as active routine</span>
              <p class="text-base-content/60 text-xs">This will be the routine you currently follow</p>
            </div>
          </label>
        </fieldset>

        <!-- Submit -->
        <div class="card-actions justify-end mt-2">
          <button
            type="submit"
            class="btn btn-primary"
          >
            Next
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
