<dialog #dialog class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold" [class.text-error]="canDelete()">{{ title() }}</h3>
    <p class="py-4 text-base-content/70">{{ message() }}</p>
    <div class="modal-action">
      @if (canDelete()) {
        <button type="button" class="btn btn-ghost" (click)="close()">Cancel</button>
        <button type="button" class="btn btn-error" (click)="confirm()">{{ confirmLabel() }}</button>
      } @else {
        <button type="button" class="btn btn-primary" (click)="close()">OK</button>
      }
    </div>
  </div>

  <!-- Clicking outside the box closes the dialog without confirming -->
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
